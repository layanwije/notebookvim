[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "notebookcli"
version = "0.1.0"
description = "A terminal-native interactive notebook"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Layan Wijegunaratne" },
]
keywords = ["cli", "jupyter", "notebook", "terminal", "tui"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Interpreters",
]
dependencies = [
  "databricks-sdk>=0.72,<1",
  "duckdb>=1.1,<2",
  "ipykernel>=6.29,<7",
  "jedi>=0.19,<1",
  "jupyter-client>=8.6,<9",
  "nbformat>=5.10,<6",
  "pyspark>=3.5,<5",
  "pyarrow>=16,<24",
  "rich>=13.9,<15",
  "textual[syntax]>=0.89,<7",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
notebookcli = "notebookcli.cli:main"

[project.urls]
Homepage = "https://github.com/layanwije/notebookcli"
Issues = "https://github.com/layanwije/notebookcli/issues"
Repository = "https://github.com/layanwije/notebookcli.git"

[tool.hatch.build.targets.wheel]
packages = ["src/notebookcli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
